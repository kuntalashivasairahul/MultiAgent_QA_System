[project]
name = "multiagent-qa-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.11.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
markers = ["integration: requires the pinned corpus and a built local index"]
