name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      LANGSMITH_TRACING: "false"
      GROQ_API_KEY: offline-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen
      - name: Offline behavioural tests without corpus or index
        run: uv run pytest -q -m "not integration"
      - name: Pinned corpus and index
        run: |
          ./fetch_corpus.sh
          uv run python ingest.py
      - name: Real retrieval and integrity integration
        run: uv run pytest -q -m integration
